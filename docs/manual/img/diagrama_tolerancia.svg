<text x="164" y="497" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2A2622" font-weight="normal" text-anchor="start">0.52  →  No equitativo (48% menos)</text>
<circle cx="479" cy="492" r="7" fill="#2F6B4F" stroke="#ffffff" stroke-width="2"/>
<text x="494" y="497" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2A2622" font-weight="normal" text-anchor="start">1.10  →  Equitativo (dentro de la banda)</text>
<circle cx="839" cy="492" r="7" fill="#B23A2E" stroke="#ffffff" stroke-width="2"/>
<text x="854" y="497" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2A2622" font-weight="normal" text-anchor="start">1.62  →  No equitativo (62% más)</text>
<rect x="140" y="556" width="1000" height="76" rx="12" fill="#FBF3F4" stroke="#C08A93" stroke-width="1.3"/>
<text x="166" y="586" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#7A3B48" font-weight="bold" text-anchor="start">Banda equitativa = [ 1 / τ ,  τ ]</text>
<text x="166" y="609" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5A534C" font-weight="normal" text-anchor="start">Con τ = 1.25  →  [ 0.80 ,  1.25 ]   ·   la “regla del 80%”: se tolera hasta un 25% de diferencia respecto a la referencia.</text>
<text x="1114" y="586" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8F877F" font-weight="normal" text-anchor="end">← más estricto   ·   más permisivo →</text>
