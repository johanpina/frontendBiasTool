<text x="905.625" y="223" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A534C" font-weight="normal" text-anchor="middle">el grupo tiene MÁS</text>
<line x1="515.0" y1="230" x2="515.0" y2="300" stroke="#7A3B48" stroke-width="2.5"/>
